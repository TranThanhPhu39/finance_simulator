[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@testkit/=../packages/testkit/contracts/",
    "@safe/=lib/safe-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-v5.2.0/contracts/"
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true

[fmt]
line_length = 120
